[project]
name = "quantum-computing-in-action"
version = "0.1.0"
description = "Companion code for the book 'Quantum Computing in Action' (Manning) — hands-on experiments with Qiskit"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = [
    "quantum-computing",
    "qiskit",
    "manning",
    "book-companion",
    "quantum-algorithms",
    "quantum-programming",
    "ibm-quantum",
]
dependencies = [
    "matplotlib>=3.11.2",
    "pylatexenc>=2.11",
    "qiskit>=2.5.2",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
    "mkdocs-static-i18n>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.3.0",
    "ty>=0.0.69",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_computing_in_action"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # Ruff specific rules
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["quantum_computing_in_action"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "error"
